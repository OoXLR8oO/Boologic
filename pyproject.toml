[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boologic"
version = "0.3.3"
description = "This is a basic library for implementing boolean propositional logic."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "pydantic>=2.13.4",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.5",
    "tool>=0.8.0",
]

authors = [
  { name = "Kartik Punna", email = "kartikpunna@gmail.com" },
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/OoXLR8oO/boologic"
Issues = "https://github.com/OoXLR8oO/boologic/issues"
Repository = "https://github.com/OoXLR8oO/boologic"

[tool.hatch.build.targets.wheel]
packages = ["boologic"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 80
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "UP", # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "hypothesis>=6.152.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "ruff>=0.15.5",
]

